# Public read-only preview of Common Manual. The site is the built frontend; the API runs
# as one serverless function wrapping the same Express app the local server uses.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/api/media/:splat"
  status = 200
